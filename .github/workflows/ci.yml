name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go test, vet & build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOWORK: "off"
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -v ./...

      - name: Build binary
        run: go build -trimpath -ldflags="-s -w" -o bin/cyber ./cmd/cyber

      - name: Smoke test CLI
        run: |
          ./bin/cyber version
          ./bin/cyber doctor --data-dir /tmp/cyber-ci-doctor --json

  rust:
    name: Rust cyber-probe test & build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test --manifest-path rust/cyber-probe/Cargo.toml --verbose

      - name: Cargo build release
        run: cargo build --release --manifest-path rust/cyber-probe/Cargo.toml

      - name: Smoke test CLI
        run: |
          ./rust/cyber-probe/target/release/cyber-probe version
          ./rust/cyber-probe/target/release/cyber-probe hash --path rust/cyber-probe/Cargo.toml

  web:
    name: TypeScript @hanzo/gui console
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir web run typecheck

      - name: Unit tests
        run: pnpm --dir web run test

      - name: Production build
        run: pnpm --dir web run build

  shell:
    name: Installer syntax & shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check install.sh
        run: |
          bash -n install.sh
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -x install.sh
