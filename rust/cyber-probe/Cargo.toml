[package]
name = "cyber-probe"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "High-speed zero-dependency Rust scanner for Hanzo Cyber (port/banner probe, secret scanner, SHA-256 tree verifier)"
repository = "https://github.com/hanzoai/cyber"
homepage = "https://cyber.hanzo.ai"
readme = "../../README.md"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
